  height: 480
  K0: [642.3066735, 0.0, 307.3946817, 0.0, 639.1076964, 232.5087614, 0.0, 0.0, 1.0]
  D0: [0.17890018, -0.20487404, -0.00149489, 0.00011301]
  K1: [644.2906011, 0.0, 340.1790450, 0.0, 640.7801152, 245.5372358, 0.0, 0.0, 1.0]
  D1: [0.18277212, -0.22449650, 0.00197455, 0.00044270]
  R: [0.99991248, 0.00017910, -0.01322857, -0.00028379, 0.99996865, -0.00791285, 0.01322674, 0.00791591, 0.99988119]
